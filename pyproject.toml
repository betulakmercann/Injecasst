[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "injecasst"
version = "1.0.0"
description = "Injecasst Security Toolkit"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0"
]

[project.scripts]
cast = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli", "cli.tools"]
